name: deploy

on:
  push:
    branches:
      - master
    paths:
      - src/**
      - Containerfile
      - Containerfile.managed
  pull_request:
    branches:
      - master
    paths:
      - src/**
      - Containerfile
      - Containerfile.managed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Containerfile
      run: |
        ACTOR=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
        IMAGE=ghcr.io/$ACTOR/wg-easy
        LONG_SHA=${{ github.sha }}
        SHORT_SHA="${LONG_SHA:0:7}"

        # config is the default image, so it is also :latest.
        podman build --squash \
          --build-arg REPO_URL="${{ github.server_url }}/${{ github.repository }}" \
          --build-arg REVISION="$LONG_SHA" \
          -t $IMAGE:config -t $IMAGE:config-$SHORT_SHA -t $IMAGE:latest \
          --file Containerfile .

        # Pull requests build both, but only master publishes them.
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          podman push $IMAGE:config
          podman push $IMAGE:config-$SHORT_SHA
          podman push $IMAGE:latest
        fi
      
    - name: Build and push Containerfile.managed
      run: |
        ACTOR=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
        IMAGE=ghcr.io/$ACTOR/wg-easy
        LONG_SHA=${{ github.sha }}
        SHORT_SHA="${LONG_SHA:0:7}"

        podman build --squash \
          --build-arg REPO_URL="${{ github.server_url }}/${{ github.repository }}" \
          --build-arg REVISION="$LONG_SHA" \
          -t $IMAGE:managed -t $IMAGE:managed-$SHORT_SHA \
          --file Containerfile.managed .
        
        # Pull requests build both, but only master publishes them.
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          podman push $IMAGE:managed
          podman push $IMAGE:managed-$SHORT_SHA
        fi
